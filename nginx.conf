server {
    # 8080, not 80: the image runs unprivileged and cannot bind below 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The bundle is text and a contest hall shares one uplink. Below a kilobyte
    # the header costs more than the saving.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript text/javascript text/css image/svg+xml application/json;

    # Hashed asset names can be cached forever; index.html must not be, or a
    # deploy leaves browsers pointing at assets that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: every unknown path is a route, not a missing file.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
