<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Unicon</title>
    <!--
      The canvas token, painted before any JavaScript runs. The colour scheme
      is decided in the theme once the bundle mounts; until then a dark-mode
      browser would show a white page and then blink to black. Two colours by
      hand is the price of not shipping the theme twice.
    -->
    <style>
      html {
        background: #f4f4f2;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0f0f0f;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
